<title>The Polinomics Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: frosted top bar; home = hero, lead, carousel, level demo band, section grids; section and story pages swap in below the bar. */
:root{
  --g1:#27b99c; --g2:#1f7a62; --g3:#17604d; --slate:#3f5f66; --mint:#d3efe5;
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --hair:rgba(0,0,0,.08);
  --band:#0d1a17; --band-ink:#f5f5f7; --link:#1f7a62; --bar:rgba(245,245,247,.72); --hl:#1f7a62; --mint-ink:#17604d; --crew-a:#e3f4ee;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --brand:"Montserrat",var(--sf);
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --hair:rgba(255,255,255,.1);
  --band:#0b1513; --band-ink:#f5f5f7; --link:#3fd1b2; --bar:rgba(22,22,23,.72); --mint:#1d3a33; --hl:#27b99c; --mint-ink:#bdf0de; --crew-a:#1a2f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --hair:rgba(255,255,255,.1);
  --band:#0b1513; --band-ink:#f5f5f7; --link:#3fd1b2; --bar:rgba(22,22,23,.72); --mint:#1d3a33; --hl:#27b99c; --mint-ink:#bdf0de; --crew-a:#1a2f2a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sf);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:6px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.bar .w{display:flex;align-items:center;gap:22px;height:52px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(118deg,var(--g1) 0 45%,var(--g2) 45%);display:grid;place-items:center}
.brand i img{width:18px;display:block}
.brand b{font-family:var(--brand);font-weight:800;font-size:.95rem;letter-spacing:.02em}
.nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:.8rem;color:var(--ink2);white-space:nowrap;padding:4px 0;transition:color .2s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]{font-weight:600}

/* Drift-in */
.pre{opacity:0;transform:translateY(36px)}
.rv{transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0s)}

/* Hero */
.hero{position:relative;padding:72px 0 40px;overflow:hidden}
.hero .w{position:relative;z-index:1}
.eyebrow{font-size:.85rem;font-weight:600;color:var(--link);letter-spacing:-.01em}
.hero h1{font-size:clamp(2.9rem,8.5vw,5.6rem);line-height:1.02;letter-spacing:-.045em;font-weight:700;margin:10px 0 18px;max-width:none}
.hero h1 span{color:var(--hl)}
.hero p.sub{font-size:clamp(1.1rem,2.2vw,1.35rem);color:var(--ink2);max-width:34ch;margin:0;line-height:1.35}
.facets{position:absolute;inset:0;pointer-events:none}
.facets span{position:absolute;display:block;opacity:.9}
.f1{width:340px;height:340px;right:-60px;top:20px;background:var(--g1);clip-path:polygon(30% 0,100% 18%,78% 100%,0 70%);animation:drift1 22s ease-in-out infinite alternate}
.f2{width:220px;height:220px;right:180px;top:200px;background:var(--g2);clip-path:polygon(0 20%,100% 0,70% 100%);animation:drift2 26s ease-in-out infinite alternate}
.f3{width:140px;height:140px;right:40px;top:300px;background:var(--slate);clip-path:polygon(50% 0,100% 100%,0 80%);opacity:.75!important;animation:drift3 18s ease-in-out infinite alternate}
.f4{width:90px;height:90px;right:330px;top:40px;background:var(--mint);clip-path:polygon(0 0,100% 30%,40% 100%);animation:drift2 20s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-40px,30px) rotate(9deg)}}
@keyframes drift2{to{transform:translate(30px,-26px) rotate(-12deg)}}
@keyframes drift3{to{transform:translate(-24px,-40px) rotate(16deg)}}
@media (max-width:820px){.facets{opacity:.35}.f2,.f4{display:none}}

/* Cover art */
.cover{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;aspect-ratio:16/10;max-width:100%;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(var(--ang,118deg),rgba(255,255,255,.14) 0 var(--cut,42%),transparent var(--cut,42%))}
.cover .n{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:700;letter-spacing:-.05em;line-height:.95}
.cover .l{font-size:.82rem;font-weight:600;opacity:.88;margin-top:6px;letter-spacing:-.005em}
.c0{background:var(--g2)}.c1{background:var(--g3)}.c2{background:var(--slate)}.c3{background:#2a9a80}.c4{background:#24504a}
.c5{background:var(--mint);color:var(--mint-ink)}

/* Lead */
.lead{display:block;background:var(--card);border-radius:28px;padding:clamp(26px,5vw,52px);margin-top:8px;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.lead:hover{transform:scale(1.008)}
.lead .txt{min-width:0;max-width:820px}
.kick{font-size:.78rem;font-weight:600;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.kick .t{color:var(--link)}
.lead h2{font-size:clamp(2rem,5vw,3.4rem);line-height:1.06;letter-spacing:-.045em;margin:12px 0 16px;text-wrap:balance}
.lead p{color:var(--ink2);margin:0 0 20px;font-size:clamp(1.05rem,1.8vw,1.25rem);max-width:60ch}
.more{color:var(--link);font-weight:500;font-size:1rem}
.more::after{content:" ›"}

/* Rows */
.row{padding:64px 0 0}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.rowhead h3{font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:-.035em;line-height:1.1;margin:0}
.rowhead a{color:var(--link);font-size:1rem;white-space:nowrap}
.rowhead a::after{content:" ›"}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,31%);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 22px 24px;margin:0 -22px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tile{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;min-width:0}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.tile .txt{padding:24px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.tile h4{font-size:1.3rem;line-height:1.2;letter-spacing:-.025em;margin:0;text-wrap:balance}
.tile p{margin:0;color:var(--ink2);font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .more{margin-top:auto;padding-top:6px;font-size:.92rem}

/* Level demo band */
.demo{background:var(--band);color:var(--band-ink);margin-top:80px;padding:84px 0;position:relative;overflow:hidden}
.demo h3{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.045em;line-height:1.04;margin:0 0 14px;max-width:14ch}
.demo h3 span{color:var(--g1)}
.demo .sub{color:#a1a1a6;font-size:1.15rem;max-width:40ch;margin:0 0 40px}
.demo .stage{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:760px}
.demo .out h4{font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.03em;line-height:1.15;margin:0 0 10px}
.demo .out p{color:#c7c7cc;margin:0;font-size:1.08rem;min-height:5.5em}
.demo .facets span{opacity:.18}

/* Level control */
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center}
.lvl .val{min-width:9.5rem}
.lvl .val small{display:block;font-size:.72rem;font-weight:600;color:inherit;opacity:.6;text-transform:uppercase;letter-spacing:.04em}
.lvl .val b{font-size:1.15rem;letter-spacing:-.02em}
.lvl .val em{display:block;font-style:normal;font-size:.8rem;opacity:.65}
.slide{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.slide span{font-size:.75rem;opacity:.65;white-space:nowrap}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;margin:0}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--g1) var(--p,40%),var(--trk,rgba(127,127,127,.3)) var(--p,40%))}
.rng::-moz-range-track{height:6px;border-radius:3px;background:var(--trk,rgba(127,127,127,.3))}
.rng::-moz-range-progress{height:6px;border-radius:3px;background:var(--g1)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
.rng::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.fade{transition:opacity .22s}
.fade.out{opacity:0}

/* Section page */
.sect{padding:60px 0 0}
.sect h1{font-size:clamp(3rem,9vw,5.4rem);letter-spacing:-.05em;line-height:1;margin:0 0 10px}
.sect p{color:var(--ink2);font-size:1.2rem;margin:0 0 36px}

/* Story page */
.story{padding:44px 0 0}
.back{color:var(--link);font-size:.95rem}
.back::before{content:"‹ "}
.story header{max-width:820px;margin:22px 0 28px}
.story h1{font-size:clamp(2.1rem,5.6vw,3.6rem);line-height:1.06;letter-spacing:-.045em;margin:12px 0 0;text-wrap:balance}
.story .banner{aspect-ratio:auto;height:clamp(200px,30vw,320px);border-radius:28px;padding:30px}
.story .banner .n{font-size:clamp(4rem,13vw,8.5rem)}
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair);margin:28px -22px 0;padding:12px 22px}
.dock .lvl{--trk:rgba(127,127,127,.25)}
.dock .lvl .val small{color:var(--ink2);opacity:1}
.article{max-width:680px;margin:34px auto 0;font-size:1.2rem;line-height:1.6;letter-spacing:-.012em}
.article p{margin:0 0 1.05em}
.why{border-top:1px solid var(--hair);padding-top:18px;margin-top:26px;font-size:1.05rem}
.why b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--link);margin-bottom:4px}
.terms{margin:22px 0 0;display:grid;gap:10px;font-size:.98rem}
.terms div{background:var(--card);border-radius:14px;padding:12px 16px}
.terms dt{font-weight:600}
.terms dd{margin:2px 0 0;color:var(--ink2)}
.srcrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:28px;font-size:.95rem}
.srcrow a{color:var(--link)}
.askbtn{background:var(--ink);color:var(--bg);border:0;border-radius:980px;padding:10px 20px;cursor:pointer;font-size:.95rem;font-weight:500}
.ask{margin-top:18px}
.ask form{display:flex;gap:10px}
.ask input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:12px 16px;border-radius:12px;border:1px solid var(--hair);background:var(--card);color:var(--ink)}
.ask input:focus{outline:2px solid var(--link);outline-offset:0}
.ask button{background:var(--g2);color:#fff;border:0;border-radius:12px;padding:0 20px;cursor:pointer;font-weight:600}
.ask button:disabled{opacity:.5}
.answer{margin-top:14px;background:var(--card);border-radius:14px;padding:14px 18px;font-size:1.02rem;white-space:pre-wrap}

/* Podcast */
.listen{flex:none;background:var(--g2);color:#fff;font-size:.78rem;font-weight:600;padding:5px 13px;border-radius:980px;margin-left:4px}
.listen:hover{background:var(--g3)}
.flink{color:var(--link)}
.pod{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(118deg,var(--g1) 0 38%,var(--g2) 38%);color:#fff;border-radius:28px;padding:clamp(26px,5vw,44px);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pod:hover{transform:scale(1.01)}
.pod div{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:34rem}
.pod small{font-size:.8rem;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.pod b{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.04em;line-height:1.08}
.pod span{opacity:.9}
.pod .podbtn{background:#fff;color:var(--g3);font-weight:600;border-radius:980px;padding:11px 20px;opacity:1;white-space:nowrap}

/* Crew */
.crewtile{background:linear-gradient(118deg,var(--crew-a) 0 40%,var(--card) 40%)}
.byline{margin:14px 0 0;color:var(--ink2);font-size:1rem}
.byline b{color:var(--ink);font-weight:600}
.invite{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:var(--r);padding:28px;border:1.5px dashed var(--link)}
.invite b{font-size:1.3rem;letter-spacing:-.025em}
.invite span{color:var(--ink2)}
.btn{display:inline-block;background:var(--g2);color:#fff;border:0;border-radius:980px;padding:11px 22px;font-weight:600;font-size:.95rem;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--link);cursor:pointer;font-size:.95rem;padding:0}
.danger{background:#c0392b;color:#fff;border:0;border-radius:980px;padding:7px 16px;cursor:pointer;margin:0 10px}
.confirm{margin-top:14px;background:var(--card);border-radius:14px;padding:12px 16px}
.orig{margin-top:26px;background:var(--card);border-radius:14px;padding:14px 18px;font-size:1.02rem}
.orig summary{cursor:pointer;color:var(--link);font-weight:500}
.orig p{margin:.8em 0 0}
.writer p{max-width:60ch}
.wform{display:flex;flex-direction:column;gap:8px;max-width:760px}
.wform label{font-size:.8rem;font-weight:600;color:var(--ink2);margin-top:10px}
.wform input,.wform select,.wform textarea{font:inherit;font-size:1.05rem;letter-spacing:-.01em;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--card);color:var(--ink);width:100%}
.wform textarea{line-height:1.55;resize:vertical;min-height:320px}
.wform input:focus,.wform select:focus,.wform textarea:focus{outline:2px solid var(--link);outline-offset:0}
.wform #w-title{font-size:1.5rem;font-weight:600;letter-spacing:-.025em}
.wrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wrow>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.wfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;color:var(--ink2);font-size:.9rem}
.wbtns{display:flex;gap:18px;align-items:center}
.wstatus{background:var(--card);border-radius:14px;padding:14px 18px;margin-top:6px}
.wstatus.err{box-shadow:inset 3px 0 0 #c0392b}
@media (max-width:560px){.wrow{grid-template-columns:minmax(0,1fr)}}

.empty{padding:120px 0;text-align:center;color:var(--ink2);font-size:1.2rem}
footer{margin-top:90px;border-top:1px solid var(--hair);padding:26px 0 50px;font-size:.78rem;color:var(--ink2);line-height:1.6}
footer .w{display:flex;flex-wrap:wrap;gap:8px 30px;justify-content:space-between}
footer b{color:var(--ink);font-weight:600}

@media (max-width:820px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{grid-auto-columns:78%}
}
@media (max-width:560px){
  .w{padding:0 16px}.rail{padding:4px 16px 24px;margin:0 -16px}.dock{margin:28px -16px 0;padding:12px 16px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .lvl{grid-template-columns:minmax(0,1fr)}
  .brand b{display:none}
  .nav{gap:16px}
  .hero{padding-top:48px}
}
@media (prefers-reduced-motion:reduce){
  .facets span{animation:none!important}.rv{transition:none}.pre{opacity:1;transform:none}
  .tile,.lead{transition:none}html{scroll-behavior:auto}
}
</style>
</head>

    <div class="val" aria-live="polite"><small data-lv-n>Reading level ${S.level+1} of 10</small><b data-lv-name>${n}</b><em data-lv-hint>${h}</em></div>
    <div class="slide"><span>More detail</span><input class="rng" id="${id}" type="range" min="0" max="9" step="1" value="${S.level}" style="--p:${S.level/9*100}%" aria-label="Reading level, from most detail to simplest" aria-valuetext="Level ${S.level+1}, ${n}"><span>Simpler</span></div>
  </div>`;
}
const crewSorted=()=>[...S.crew].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

/* Views */
function home(){
  const st=S.stories, lead=st[0], top=st.slice(1,8), crew=crewSorted().slice(0,3);
  const uk=st.filter(SECTIONS.uk.f).filter(s=>s!==lead).slice(0,6), world=st.filter(SECTIONS.world.f).slice(0,6);
  const lv=lead?v(lead):{};
  const crewRow=crew.length?`<section class="row"><div class="rowhead rv"><h3>From the crew.</h3><a href="#crew">All articles</a></div><div class="grid">${crew.map(tile).join("")}</div></section>`
    :S.canWrite?`<section class="row"><a class="invite rv" href="#write"><b>Write the first crew article.</b><span>Your article gets all ten reading levels automatically.</span></a></section>`:"";
  return `<section class="hero">${facets}<div class="w">
      <div class="eyebrow">${esc(S.edition?.label||"Today")}</div>
      <h1>The news.<br><span>Your level.</span></h1>
      <p class="sub">The day's politics and economics, told in as much or as little detail as you want.</p>
    </div></section>
    <div class="w">
      ${lead?`<a class="lead rv" href="${href(lead)}"><div class="txt">${kick(lead)}<h2 class="fade" data-h="${esc(lead.id)}">${esc(lv.headline)}</h2><p class="fade" data-p="${esc(lead.id)}">${esc(firstPara(lead))}</p><span class="more">Read the story</span></div></a>`:""}
      ${crewRow}
      ${top.length?`<section class="row"><div class="rowhead rv"><h3>Top stories.</h3></div><div class="rail">${top.map(tile).join("")}</div></section>`:""}
    </div>
    ${lead?`<section class="demo">${facets}<div class="w">
      <h3 class="rv">One story. <span>Ten ways</span> to tell it.</h3>
      <p class="sub rv">Slide from every last figure to the simplest version. Your setting carries across every story.</p>
      <div class="stage rv">${lvlCtl("lvl-demo")}<div class="out"><h4 class="fade" data-h="${esc(lead.id)}">${esc(lv.headline)}</h4><p class="fade" data-p="${esc(lead.id)}">${esc(firstPara(lead))}</p></div></div>
    </div></section>`:""}
    <div class="w">
      <section class="row"><a class="pod rv" href="${POD}" target="_blank" rel="noopener">
        <div><small>The podcast</small><b>Hear the crew talk it through.</b><span>Wilf, Ollie and Rohan on the week's politics and economics.</span></div>
        <span class="podbtn">Listen on Spotify ↗</span></a></section>
      ${uk.length?`<section class="row"><div class="rowhead rv"><h3>UK.</h3><a href="#uk">See all</a></div><div class="grid">${uk.map(tile).join("")}</div></section>`:""}
      ${world.length?`<section class="row"><div class="rowhead rv"><h3>World.</h3><a href="#world">See all</a></div><div class="grid">${world.map(tile).join("")}</div></section>`:""}
    </div>`;
}
function section(key){
  const sec=SECTIONS[key],list=S.stories.filter(sec.f);
  return `<div class="w sect"><h1 class="rv">${sec.title}</h1><p class="rv">${sec.sub} ${list.length} ${list.length===1?"story":"stories"} today.</p>
    <div class="dock" style="margin-bottom:28px">${lvlCtl("lvl-sec")}</div>
    <div class="grid">${list.map(tile).join("")||`<p class="empty">Nothing in this section today.</p>`}</div></div>`;
}
function crewPage(){
  const list=crewSorted();
  return `<div class="w sect"><h1 class="rv">The Crew.</h1><p class="rv">Articles written by ${CREW.slice(0,2).join(", ")} and ${CREW[2]}, at whatever level you like.</p>
    ${S.canWrite?`<p><a class="btn" href="#write">Write an article</a></p>`:""}
    <div class="dock" style="margin-bottom:28px">${lvlCtl("lvl-crew")}</div>
    <div class="grid">${list.map(tile).join("")||`<p class="empty">No crew articles yet.${S.canWrite?" Write the first one.":""}</p>`}</div></div>`;
}
function storyBody(s){
  const x=v(s);
  return `${(x.body||"").split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}${x.why?`<div class="why"><b>Why it matters</b>${esc(x.why)}</div>`:""}`;
}
function story(id){
  const s=find(id);
  if(!s)return `<p class="empty w">That article isn't here any more. <a class="more" href="#today">Back to today</a></p>`;
  const pool=s.crew?crewSorted():S.stories,i=pool.indexOf(s),next=[...pool.slice(i+1),...pool.slice(0,i)].slice(0,3);
  const mine=s.crew&&S.canWrite&&(S.owner||s.authorId===S.me);
  return `<article class="w story">
    <a class="back" href="${s.crew?"#crew":"#today"}">${s.crew?"The Crew":"Today"}</a>
    <header>${kick(s)}<h1 class="fade" data-h="${esc(s.id)}">${esc(v(s).headline)}</h1>${s.crew?`<p class="byline">By <b>${esc(s.byline)}</b> · ${dateFmt(s.createdAt)}</p>`:""}</header>
    <div class="dock">${lvlCtl("lvl-story")}</div>
    <div class="article"><div class="fade" id="body">${storyBody(s)}</div>
      ${s.terms&&s.terms.length?`<dl class="terms">${s.terms.map(t=>`<div><dt>${esc(t.term)}</dt><dd>${esc(t.meaning)}</dd></div>`).join("")}</dl>`:""}
      ${s.crew&&s.levels&&s.levels.length?`<details class="orig"><summary>Read it as ${esc(s.byline.split(" ")[0])} wrote it</summary>${s.body.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}</details>`:""}
      <div class="srcrow">${s.crew?"":`<a href="${esc(s.url)}" target="_blank" rel="noopener">Source: ${esc(s.source)} ↗</a>`}${S.sample?`<button class="askbtn" type="button" id="askbtn">Ask a question</button>`:""}
        ${mine?`<a class="more" href="#write-${esc(s.id)}">Edit</a><button class="linkbtn" type="button" id="delbtn">Delete</button>`:""}</div>
      ${mine?`<div class="confirm" id="delconf" hidden>Delete this article for everyone? <button class="danger" type="button" id="delyes">Delete</button><button class="linkbtn" type="button" id="delno">Keep it</button></div>`:""}
      <div class="ask" id="ask" hidden><form id="askf"><input id="q" maxlength="300" placeholder="How could this affect me?" aria-label="Your question"><button type="submit">Ask</button></form><div class="answer" id="ans" hidden></div></div>
    </div>
    ${next.length?`<section class="row"><div class="rowhead rv"><h3>Up next.</h3></div><div class="grid">${next.map(tile).join("")}</div></section>`:""}
  </article>`;
}
function writer(id){
  if(!S.canWrite)return `<div class="w sect"><h1>Write.</h1><p>Only the crew can write articles. If you're Wilf, Rohan or Ollie and you see this, ask Ollie to share the page with you as an Editor.</p></div>`;
  const e=id?S.crew.find(s=>s.id===id):null;
  let d={};try{d=JSON.parse(localStorage.getItem("pc-draft")||"{}")}catch(x){}
  const f=e||d;
  const opt=(arr,val)=>arr.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("");
  return `<div class="w sect writer"><h1>${e?"Edit.":"Write."}</h1><p>Write it your way. When you publish, Claude rewrites it at all ten reading levels so anyone can read it.</p>
    <form id="wf" class="wform">
      <label for="w-title">Headline</label><input id="w-title" maxlength="140" required value="${esc(f.title||"")}" placeholder="e.g. Why the Bank of England is stuck">
      <div class="wrow">
        <div><label for="w-by">Written by</label><select id="w-by">${opt(CREW,f.byline)}</select></div>
        <div><label for="w-topic">Topic</label><select id="w-topic">${opt(["Politics","Economy"],f.topic)}</select></div>
        <div><label for="w-region">Region</label><select id="w-region">${opt(REGIONS,f.region)}</select></div>
      </div>
      <label for="w-body">Article</label><textarea id="w-body" rows="16" required placeholder="Write your article here. Leave a blank line between paragraphs.">${esc(f.body||"")}</textarea>
      <div class="wfoot"><span id="w-count"></span><span class="wbtns"><a class="linkbtn" href="${e?"#c-"+esc(e.id):"#crew"}">Cancel</a><button class="btn" type="submit" id="w-go">${e?"Save and republish":"Publish"}</button></span></div>
      <div class="wstatus" id="w-status" hidden></div>
    </form></div>`;
}

/* Router */
function render(scroll){
  const h=route();
  document.querySelectorAll("#nav a").forEach(a=>{const t=a.getAttribute("href").slice(1);if(t===h||(t==="crew"&&(h.startsWith("c-")||h.startsWith("write"))))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(!S.loaded)return;
  if(document.getElementById("wf")&&h.startsWith("write")&&!scroll)return; // don't wipe a draft mid-typing
  app.innerHTML=h.startsWith("s-")||h.startsWith("c-")?story(h.slice(2)):h==="crew"?crewPage():h.startsWith("write")?crewPage():SECTIONS[h]?section(h):S.stories.length?home():crewPage();
  if(scroll)window.scrollTo(0,0);
  wire();drift();
}
addEventListener("hashchange",()=>render(true));

/* Level changes update text in place */
function setLevel(l){
  l=Math.max(0,Math.min(9,l));if(l===S.level)return;S.level=l;
  try{localStorage.setItem("pc-level",l)}catch(e){}
  const [n,h]=LEVELS[l];
  document.querySelectorAll("[data-lvl]").forEach(c=>{
    c.querySelector("[data-lv-n]").textContent=`Reading level ${l+1} of 10`;c.querySelector("[data-lv-name]").textContent=n;c.querySelector("[data-lv-hint]").textContent=h;
    const r=c.querySelector(".rng");if(+r.value!==l)r.value=l;r.style.setProperty("--p",l/9*100+"%");r.setAttribute("aria-valuetext",`Level ${l+1}, ${n}`);
  });
  const els=document.querySelectorAll("[data-h],[data-p],#body");
  els.forEach(e=>e.classList.add("out"));
  clearTimeout(setLevel.t);setLevel.t=setTimeout(()=>{
    els.forEach(e=>{
      const s=e.id==="body"?current():find(e.dataset.h||e.dataset.p);
      if(s){if(e.id==="body")e.innerHTML=storyBody(s);else if(e.dataset.h)e.textContent=v(s).headline;else e.textContent=firstPara(s)}
      e.classList.remove("out");
    });
  },200);
}
function wire(){
  document.querySelectorAll(".rng").forEach(r=>r.addEventListener("input",()=>setLevel(+r.value)));
  const $=id=>document.getElementById(id);
  if($("askbtn")){$("askbtn").onclick=()=>{$("ask").hidden=!$("ask").hidden;if(!$("ask").hidden)$("q").focus()};$("askf").onsubmit=e=>{e.preventDefault();ask()}}
  if($("delbtn")){$("delbtn").onclick=()=>{$("delconf").hidden=false};$("delno").onclick=()=>{$("delconf").hidden=true};
    $("delyes").onclick=async()=>{const s=current();$("delyes").disabled=true;try{await S.db.doc("crew/"+s.id).delete();location.hash="#crew"}catch(e){$("delconf").textContent="Couldn't delete it. Only Editors of this page can delete articles."}}}
  if($("wf"))wireWriter();
}

/* Writing crew articles */
function wireWriter(){
  const $=id=>document.getElementById(id),editing=route().startsWith("write-")?route().slice(6):null;
  const count=()=>{const n=($("w-body").value.trim().match(/\S+/g)||[]).length;$("w-count").textContent=`${n} words`};
  count();
  $("wf").oninput=()=>{count();if(!editing)try{localStorage.setItem("pc-draft",JSON.stringify({title:$("w-title").value,byline:$("w-by").value,topic:$("w-topic").value,region:$("w-region").value,body:$("w-body").value}))}catch(e){}};
  $("wf").onsubmit=async ev=>{
    ev.preventDefault();
    const a={title:$("w-title").value.trim(),byline:$("w-by").value,topic:$("w-topic").value,region:$("w-region").value,body:$("w-body").value.trim().replace(/\n{3,}/g,"\n\n")};
    const words=(a.body.match(/\S+/g)||[]).length,st=$("w-status");
    st.hidden=false;st.className="wstatus";
    if(!a.title||words<40){st.textContent="Write at least 40 words, and give it a headline, before publishing.";st.classList.add("err");return}
    $("w-go").disabled=true;
    let levels=[],terms=[];
    if(S.sample){
      const ctl=new AbortController();
      st.innerHTML=`<span id="w-prog">Claude is writing the ten reading levels. This usually takes under a minute.</span> <button class="linkbtn" type="button" id="w-stop">Stop</button>`;
      $("w-stop").onclick=()=>ctl.abort();
      try{
        const r=await S.sample.json(levelPrompt(a),{signal:ctl.signal,cache:false,onText:({text})=>{const n=(text.match(/"headline"/g)||[]).length;const p=$("w-prog");if(p&&n)p.textContent=`Writing reading levels: ${Math.min(n,10)} of 10 done.`}});
        if(r&&Array.isArray(r.levels)&&r.levels.length===10&&r.levels.every(x=>x&&x.headline&&x.body)){levels=r.levels.map(x=>({headline:String(x.headline),body:String(x.body),why:String(x.why||"")}));terms=Array.isArray(r.terms)?r.terms.slice(0,4).map(t=>({term:String(t.term||""),meaning:String(t.meaning||"")})):[]}
        else throw {code:"bad_shape"};
      }catch(e){
        $("w-go").disabled=false;st.classList.add("err");
        st.innerHTML=`${e.code==="cancelled"?"Stopped.":e.code==="not_granted"?"Claude needs your permission to write the reading levels.":e.code==="rate_limited"?"Claude is busy. Wait a minute and try again.":"Claude couldn't write the reading levels this time."} You can try again, or <button class="linkbtn" type="button" id="w-plain">publish it as written</button> and readers will see your version at every level.`;
        $("w-plain").onclick=()=>save(a,[],[],editing);
        return;
      }
    }
    save(a,levels,terms,editing);
  };
}
async function save(a,levels,terms,editing){
  const st=document.getElementById("w-status");st.className="wstatus";st.textContent="Publishing…";
  const prev=editing?S.crew.find(s=>s.id===editing):null;
  const doc={...a,levels,terms,authorId:prev?prev.authorId:S.me,createdAt:prev?prev.createdAt:Date.now(),updatedAt:Date.now()};
  try{
    let id=editing;
    if(editing)await S.db.doc("crew/"+editing).set(doc);else id=(await S.db.collection("crew").add(doc)).id;
    if(!editing)try{localStorage.removeItem("pc-draft")}catch(e){}
    location.hash="#c-"+id;
  }catch(e){st.classList.add("err");st.textContent="Couldn't publish. Only Editors of this page can publish articles. Your writing is still here.";document.getElementById("w-go").disabled=false}
}
function levelPrompt(a){
  return `You are rewriting an article by a student journalist for a news site where readers choose a reading level from 1 to 10. Produce ten versions of the article.

RULES
- Keep the author's facts, argument and point of view. If it is an opinion piece, keep it clearly the author's opinion. Do not add new facts, figures, quotes or names; you may add widely known background only to explain a term.
- Every version must be a SIMILAR LENGTH: about 110 to 160 words, in 3 or 4 paragraphs (the original can be shorter or longer; match roughly). Simpler levels must not be shorter. They explain more, in easier words.
- British English. No em-dashes. Plain text in "body", with paragraphs separated by \\n.
- Level 1 (index 0) stays closest to the author's own wording.
Levels, from index 0 to 9: ${LEVELS.map((l,i)=>`${i}: ${l[0]} (${l[1]})`).join("; ")}.
Index 9 should use an everyday comparison a young child knows (school, pocket money, the playground).
"why" is one sentence on why it matters, written at that level.

Reply with only JSON in this shape:
{"levels":[{"headline":"...","body":"...","why":"..."}, ... exactly 10 objects], "terms":[{"term":"...","meaning":"short plain definition"}] (2 or 3 jargon words from the article, or [] if none)}

ARTICLE
Headline: ${a.title}
Topic: ${a.topic}, ${a.region}
By: ${a.byline}

${a.body}`;
}

/* Elements below the fold drift in as they're scrolled to; anything already on screen stays put */
let io;
function drift(){
  const els=[...app.querySelectorAll(".rv")];
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  const vh=innerHeight;
  els.forEach(el=>{if(el.getBoundingClientRect().top>vh*.92){el.classList.add("pre");io.observe(el)}});
}

async function ask(){
  const q=document.getElementById("q").value.trim();if(!q)return;
  const s=current();if(!s)return;
  const full=(s.levels||[])[0]||{headline:s.title,body:s.body},out=document.getElementById("ans"),btn=document.querySelector("#askf button");
  out.hidden=false;out.textContent="Thinking…";btn.disabled=true;
  const [n,h]=LEVELS[S.level];
  const prompt=`You help readers of a news app understand ${s.crew?"an article":"a story"}. The reader chose reading level ${S.level+1} of 10 ("${n}": ${h}; 1 is expert detail, 10 is for a young child). Answer at that level in under 120 words, in British English. Use only the text and widely known background; if it doesn't cover the question, say you're not sure. Plain text, no headings.

${s.crew?`ARTICLE by ${s.byline}`:`STORY (${s.source})`}: ${full.headline}
${full.body}

QUESTION: ${q}`;
  try{const r=await S.sample(prompt,{modelTier:"quick",onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(err){out.textContent=err&&err.text?err.text:err&&err.code==="rate_limited"?"Too many questions at once. Wait a minute and try again.":err&&err.code==="not_granted"?"Asking a question needs your permission. Reload the page to be asked again.":"Couldn't get an answer just now. Try again in a moment."}
  finally{btn.disabled=false}
}

(async()=>{
  try{
    const get=f=>fetch("data/"+f+"?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()});
    const [st,cr,ed]=await Promise.all([get("stories.json"),get("crew.json").catch(()=>[]),get("edition.json").catch(()=>null)]);
    S.stories=st;S.crew=cr.map(c=>({...c,crew:true}));S.edition=ed;S.loaded=true;render(false);
  }catch(e){app.innerHTML=`<p class="empty w">Couldn't load today's stories. Refresh the page to try again.</p>`}
})();
</script>

</body>
</html>
